<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Handskrift — Fingerspelling Teacher</title>
  <link rel="preload" href="fonts/Caveat-VariableFont_wght.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1 class="brand">
      <span class="wordmark" lang="sv">Handskrift</span>
      <span class="descriptor">Fingerspelling Teacher</span>
    </h1>

    <div class="modes" role="radiogroup" aria-label="Sign language">
      <button type="button" class="mode" data-mode="sts" role="radio" aria-checked="true">
        STS <span class="mode-sub">Svenskt teckenspråk</span>
      </button>
      <button type="button" class="mode" data-mode="asl" role="radio" aria-checked="false">
        ASL <span class="mode-sub">American Sign Language</span>
      </button>
    </div>
  </header>

  <main>
    <p class="gloss">Handskrift is Swedish for handwriting. Here, you write with your hands.</p>

    <form id="controls" autocomplete="off">
      <label for="word" class="visually-hidden">Word to fingerspell</label>
      <input id="word" name="word" type="text" placeholder="Write a word, like katt"
             maxlength="40" spellcheck="false" autocapitalize="characters">
    </form>

    <ol id="output" class="line" aria-live="polite"></ol>
    <p id="empty" class="empty">Each letter's hand appears on this line.</p>
  </main>

  <footer>
    <p id="credit" class="credit"></p>
    <p>Full credits in
      <a href="https://github.com/sumpe/handskrift/blob/main/CREDITS.md">CREDITS.md</a>.
      Code on <a href="https://github.com/sumpe/handskrift">GitHub</a>.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
